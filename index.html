<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机音乐画布</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }

  canvas { position: fixed; top: 0; left: 0; z-index: 0; }

  #ui {
    position: fixed; z-index: 10; pointer-events: none;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 6vh;
  }

  #info {
    pointer-events: auto;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 20px rgba(0,0,0,0.5);
    user-select: none;
    -webkit-user-select: none;
  }

  #info h1 {
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    opacity: 0.9;
    margin-bottom: 4px;
  }

  #info .hint {
    font-size: 0.85rem;
    opacity: 0.6;
    letter-spacing: 0.05em;
    transition: opacity 0.4s;
  }

  #badge {
    pointer-events: auto;
    position: fixed; top: 24px; right: 24px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 8px 16px;
    color: #fff;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    user-select: none;
    -webkit-user-select: none;
    transition: all 0.5s;
  }

  #mode-btn {
    pointer-events: auto;
    position: fixed; top: 24px; left: 24px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%;
    width: 44px; height: 44px;
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  #mode-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
  #mode-btn:active { transform: scale(0.95); }

  /* Tap indicator */
  .ripple {
    position: fixed; pointer-events: none;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.5);
    animation: rippleOut 0.8s ease-out forwards;
    z-index: 5;
  }
  @keyframes rippleOut {
    0% { width: 0; height: 0; opacity: 0.8; }
    100% { width: 120px; height: 120px; opacity: 0; transform: translate(-60px, -60px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="mode-btn" title="切换模式">🎵</button>
<div id="badge"></div>

<div id="ui">
  <div id="info">
    <h1 id="scale-name"></h1>
    <div class="hint" id="hint-text">点击 · 滑动 · 演奏</div>
  </div>
</div>

<script>
// ─────────────────── 随机引擎 ───────────────────
const seeds = {
  scale: Math.floor(Math.random() * 12),
  hue: Math.floor(Math.random() * 360),
  waveform: Math.floor(Math.random() * 4),
};

// 调式库
const scales = [
  { name: '宫 · 五声音阶',   intervals: [0,2,4,7,9],   mood: '温暖明亮' },
  { name: '商 · 五声音阶',   intervals: [0,3,5,7,10],  mood: '古朴悠远' },
  { name: '角 · 五声音阶',   intervals: [0,4,5,7,11],  mood: '灵动跳脱' },
  { name: '徵 · 五声音阶',   intervals: [0,2,5,7,9],   mood: '热烈欢快' },
  { name: '羽 · 五声音阶',   intervals: [0,3,5,7,10],  mood: '深沉内敛' },
  { name: '自然大调',        intervals: [0,2,4,5,7,9,11], mood: '经典明亮' },
  { name: '自然小调',        intervals: [0,2,3,5,7,8,10], mood: '忧郁深邃' },
  { name: '多利亚调式',      intervals: [0,2,3,5,7,9,10], mood: '爵士韵味' },
  { name: '弗里吉亚调式',    intervals: [0,1,3,5,7,8,10], mood: '异域风情' },
  { name: '利底亚调式',      intervals: [0,2,4,6,7,9,11], mood: '梦幻飘渺' },
  { name: '混合利底亚调式',  intervals: [0,2,4,5,7,9,10], mood: '蓝调灵魂' },
  { name: '全音阶',          intervals: [0,2,4,6,8,10],    mood: '超现实感' },
];

const rootNote = 48 + seeds.scale; // 随机根音
const scale = scales[seeds.scale];
const notes = scale.intervals.map(i => rootNote + i);

// 扩展音域
const allNotes = [];
for (let oct = -1; oct <= 2; oct++) {
  scale.intervals.forEach(i => allNotes.push(rootNote + i + oct * 12));
}

// 视觉主题
const hue = seeds.hue;
const theme = {
  hue,
  bg: `hsl(${hue}, 15%, 4%)`,
  accent1: `hsl(${(hue + 30) % 360}, 70%, 55%)`,
  accent2: `hsl(${(hue + 180) % 360}, 60%, 60%)`,
  accent3: `hsl(${(hue + 300) % 360}, 50%, 65%)`,
};

// 波形
const waveforms = ['sine', 'triangle', 'sawtooth', 'square'];
const waveform = waveforms[seeds.waveform];

// ─────────────────── 音频引擎 ───────────────────
let audioCtx = null;
const activeNotes = new Map();

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 全局混响
    const convolver = audioCtx.createConvolver();
    const reverbIR = createReverbIR(audioCtx, 1.5, 0.4);
    convolver.buffer = reverbIR;
    convolver.connect(audioCtx.destination);
    window.__reverb = convolver;
    // 延迟
    const delay = audioCtx.createDelay(0.35);
    delay.delayTime.value = 0.28;
    const feedback = audioCtx.createGain();
    feedback.gain.value = 0.35;
    const dryGain = audioCtx.createGain();
    dryGain.gain.value = 0.7;
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(convolver);
    feedback.connect(convolver);
    dryGain.connect(convolver);
    window.__delayIn = delay;
    window.__delayDry = dryGain;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function createReverbIR(ctx, duration, decay) {
  const sampleRate = ctx.sampleRate;
  const length = sampleRate * duration;
  const buffer = ctx.createBuffer(2, length, sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buffer.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay * 4);
    }
  }
  return buffer;
}

function playNote(freq, vel = 0.6, pan = 0) {
  ensureAudio();
  const ctx = audioCtx;
  const now = ctx.currentTime;

  // 主音
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const panner = ctx.createStereoPanner();

  osc.type = waveform;
  osc.frequency.value = freq;

  const env = 0.08 + Math.random() * 0.04;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vel, now + env * 0.3);
  gain.gain.exponentialRampToValueAtTime(vel * 0.6, now + env * 0.6);
  gain.gain.exponentialRampToValueAtTime(0.001, now + env * 2.5);

  panner.pan.value = pan;

  osc.connect(gain);
  gain.connect(panner);
  panner.connect(window.__delayIn || ctx.destination);
  panner.connect(window.__delayDry || ctx.destination);

  // 泛音
  const harm = ctx.createOscillator();
  const harmGain = ctx.createGain();
  harm.type = 'sine';
  harm.frequency.value = freq * 2;
  harmGain.gain.setValueAtTime(0, now);
  harmGain.gain.linearRampToValueAtTime(vel * 0.15, now + 0.02);
  harmGain.gain.exponentialRampToValueAtTime(0.001, now + env * 1.5);
  harm.connect(harmGain);
  harmGain.connect(panner);

  osc.start(now);
  osc.stop(now + env * 3);
  harm.start(now);
  harm.stop(now + env * 2.5);

  const id = Symbol();
  activeNotes.set(id, { osc, harm, gain, harmGain, panner });
  setTimeout(() => { activeNotes.delete(id); }, (env * 3 + 0.1) * 1000);
}

function getNoteForY(y, height) {
  const idx = Math.floor(((height - y) / height) * allNotes.length);
  return allNotes[Math.max(0, Math.min(allNotes.length - 1, idx))];
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function getPanForX(x, width) {
  return ((x / width) * 2 - 1) * 0.7;
}

// ─────────────────── 视觉引擎 ───────────────────
const canvas = document.getElementById('c');
const ctx2d = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Particle {
  constructor(x, y, hueOffset = 0, noteIdx = 0) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - 2;
    this.life = 1;
    this.decay = 0.006 + Math.random() * 0.018;
    this.size = 2 + Math.random() * 5;
    this.hue = (theme.hue + hueOffset + Math.random() * 40) % 360;
    this.noteIdx = noteIdx;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.03;
    this.life -= this.decay;
    this.size *= 0.995;
  }

  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.life * 0.7;
    ctx.fillStyle = `hsl(${this.hue}, 70%, ${50 + (1 - this.life) * 30}%)`;
    ctx.shadowColor = `hsl(${this.hue}, 80%, 60%)`;
    ctx.shadowBlur = this.size * 3;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const particles = [];

// 背景星星
class Star {
  constructor() {
    this.reset(true);
  }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 5;
    this.size = Math.random() * 1.5;
    this.speed = 0.2 + Math.random() * 0.6;
    this.opacity = 0.3 + Math.random() * 0.5;
    this.hue = (theme.hue + Math.random() * 60 - 30) % 360;
  }
  update() {
    this.y -= this.speed;
    if (this.y < -5) this.reset(false);
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle = `hsl(${this.hue}, 50%, 70%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const stars = Array.from({ length: 80 }, () => new Star());

// 波纹
const ripples = [];
function addRipple(x, y) {
  ripples.push({ x, y, r: 0, life: 1 });
}

function drawRipples(ctx) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += 3;
    r.life -= 0.025;
    if (r.life <= 0) { ripples.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = r.life * 0.4;
    ctx.strokeStyle = `hsl(${theme.hue}, 60%, 70%)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// 当前鼠标/触摸位置的波纹
let cursorWave = { x: W / 2, y: H / 2, active: false };

function draw() {
  requestAnimationFrame(draw);

  ctx2d.fillStyle = theme.bg;
  ctx2d.fillRect(0, 0, W, H);

  // 星星
  for (const s of stars) {
    s.update();
    s.draw(ctx2d);
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    if (particles[i].life <= 0) { particles.splice(i, 1); continue; }
    particles[i].draw(ctx2d);
  }

  // 波纹
  drawRipples(ctx2d);

  // 底部引导线
  ctx2d.save();
  const grad = ctx2d.createLinearGradient(0, H - 100, 0, H);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(1, `hsla(${theme.hue}, 40%, 50%, 0.08)`);
  ctx2d.fillStyle = grad;
  ctx2d.fillRect(0, H - 100, W, 100);

  // 音符参考点
  for (let i = 0; i < allNotes.length; i++) {
    const y = H - 20 - (i / (allNotes.length - 1)) * (H - 80);
    const alpha = 0.06;
    ctx2d.fillStyle = `hsla(${theme.hue}, 50%, 60%, ${alpha})`;
    ctx2d.fillRect(20, y, W - 40, 1);
  }
  ctx2d.restore();
}

// ─────────────────── 交互处理 ───────────────────
let mode = 'tap'; // tap | slide | both
let dragging = false;
let lastPlayedNote = -1;
let lastPlayedTime = 0;
const PLAY_COOLDOWN = 60; // ms between note triggers when sliding

function trigger(x, y) {
  ensureAudio();
  const note = getNoteForY(y, H);
  const freq = midiToFreq(note);
  const pan = getPanForX(x, W);
  const vel = 0.3 + Math.random() * 0.3;
  playNote(freq, vel, pan);

  // 粒子爆发
  const hueOff = (note - rootNote) * 30;
  for (let i = 0; i < 6; i++) {
    particles.push(new Particle(x, y, hueOff, note % 12));
  }
  addRipple(x, y);

  if (note !== lastPlayedNote) {
    lastPlayedNote = note;
  }
}

function handlePointerDown(e) {
  e.preventDefault();
  ensureAudio();
  dragging = true;
  lastPlayedTime = 0;
  const { x, y } = getPos(e);
  cursorWave = { x, y, active: true };
  trigger(x, y);
}

function handlePointerMove(e) {
  e.preventDefault();
  const { x, y } = getPos(e);
  cursorWave = { x, y, active: true };

  if (dragging && mode !== 'tap') {
    const now = performance.now();
    if (now - lastPlayedTime > PLAY_COOLDOWN) {
      trigger(x, y);
      lastPlayedTime = now;
    }
  }
}

function handlePointerUp(e) {
  e.preventDefault();
  dragging = false;
  cursorWave.active = false;
}

function getPos(e) {
  if (e.touches) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

// 键盘演奏
const keyMap = {};
const keyNotes = 'ASDFGHJKL'.split(''); // 分配给音符的键
let keyAssignments = {};
function assignKeys() {
  const mid = Math.floor(allNotes.length / 2);
  keyNotes.forEach((k, i) => {
    const idx = mid + i - Math.floor(keyNotes.length / 2);
    keyAssignments[k] = allNotes[Math.max(0, Math.min(allNotes.length - 1, idx))];
  });
}
assignKeys();

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toUpperCase();
  if (keyAssignments[k] && !keyMap[k]) {
    keyMap[k] = true;
    ensureAudio();
    const note = keyAssignments[k];
    const freq = midiToFreq(note);
    const pan = (Math.random() - 0.5) * 0.5;
    playNote(freq, 0.5, pan);
    // 键盘事件也给一些粒子
    const x = W / 2 + (keyNotes.indexOf(k) - 4) * 40;
    const y = H / 2;
    for (let i = 0; i < 3; i++) {
      particles.push(new Particle(x, y, (note - rootNote) * 30, note % 12));
    }
    addRipple(x, y);
  }
});

window.addEventListener('keyup', e => {
  keyMap[e.key.toUpperCase()] = false;
});

canvas.addEventListener('pointerdown', handlePointerDown);
canvas.addEventListener('pointermove', handlePointerMove);
window.addEventListener('pointerup', handlePointerUp);
canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
window.addEventListener('touchend', handlePointerUp);

// 模式切换
const modeBtn = document.getElementById('mode-btn');
const modes = ['tap', 'slide', 'both'];
const modeIcons = { tap: '👆', slide: '✋', both: '🎹' };
const modeHints = {
  tap: '点击演奏 · 键盘 ASDFGHJKL',
  slide: '滑动演奏 · 长按拖拽',
  both: '点击 + 滑动 · 尽情演奏',
};
modeBtn.addEventListener('click', () => {
  const idx = (modes.indexOf(mode) + 1) % modes.length;
  mode = modes[idx];
  modeBtn.textContent = modeIcons[mode];
  modeBtn.title = modes[idx];
  document.getElementById('hint-text').textContent = modeHints[mode];
});

// ─────────────────── UI 更新 ───────────────────
document.getElementById('scale-name').textContent = scale.name;
document.getElementById('badge').textContent =
  `${scale.mood} · ${waveform}波 · HSL(${hue})`;
document.getElementById('hint-text').textContent = modeHints[mode];

// 主题色应用
document.body.style.background = theme.bg;
document.getElementById('scale-name').style.color = theme.accent1;
document.getElementById('badge').style.borderColor =
  `hsla(${(theme.hue + 40) % 360}, 60%, 60%, 0.3)`;

// ─────────────────── 动画循环 ───────────────────
draw();

// ─────────────────── 自动演示 ───────────────────
let autoPlayTimeout;
function autoPlay() {
  if (dragging || activeNotes.size > 3) {
    autoPlayTimeout = setTimeout(autoPlay, 2000);
    return;
  }
  const x = 50 + Math.random() * (W - 100);
  const y = 100 + Math.random() * (H - 200);
  cursorWave = { x, y, active: true };
  trigger(x, y);
  autoPlayTimeout = setTimeout(autoPlay, 1500 + Math.random() * 3000);
}
autoPlayTimeout = setTimeout(autoPlay, 2000);

console.log(`%c🎵 你的随机音乐画布已就绪 %c| %s | %s | HSL(%d)`,
  'font-size:1.2em', '', scale.name, scale.mood, hue);
console.log('%c音域: %d 个音符 | 波形: %s | 键盘: ASDFGHJKL',
  'color:#aaa', allNotes.length, waveform);
console.log('%c刷新页面可获得全新的随机组合 ✨', 'color:#aaa');
</script>
</body>
</html>
